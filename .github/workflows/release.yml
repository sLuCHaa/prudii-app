name: Release

# Baut Prudii Mail fuer Windows, macOS (Apple Silicon + Intel) und Linux (.deb).
#
# Ausloeser:
#   - Push eines Version-Tags (z. B. `git tag v1.1.2 && git push --tags`)
#     -> erstellt einen DRAFT-Release mit allen Installern.
#   - Manuell ueber den "Run workflow"-Button (workflow_dispatch)
#     -> baut nur und haengt die Installer als Download an den Actions-Run
#        (kein Release), praktisch zum Testen.
#
# Third-Party-Actions sind auf einen festen Commit-SHA gepinnt (Supply-Chain-
# Absicherung; bewegliche Tags koennten gekapert werden). Dependabot
# (.github/dependabot.yml) haelt die SHAs per PR aktuell.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Legt den Release einmal an. Vorher tat das jeder Matrix-Job selbst: tauri-action
  # sucht den Release zum Tag und erstellt ihn, wenn er fehlt — bestehen zwei Jobs
  # diese Pruefung gleichzeitig, entstehen zwei Releases zum selben Tag und die
  # Installer verteilen sich auf beide (so geschehen bei v1.6.2: der veroeffentlichte
  # enthielt kein Windows). Ein einzelner Job kann nicht mit sich selbst rennen.
  create-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create or reuse the draft release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          find_id() {
            gh api "repos/$GH_REPO/releases" --paginate               --jq "[.[] | select(.tag_name == \"$TAG\")] | first | .id // empty"
          }

          # Ein erneuter Lauf desselben Tags soll den vorhandenen Release
          # weiterbefuellen statt einen zweiten anzulegen.
          id="$(find_id)"
          if [ -n "$id" ]; then
            echo "Release fuer $TAG existiert bereits (id $id) — wird wiederverwendet."
          else
            cat > notes.md <<'NOTES'
          Prudii Mail __VERSION__ — privacy-first desktop email client. Install the file for your platform below: Windows (.exe / .msi), macOS (.dmg — Apple Silicon or Intel), Linux (.deb / .rpm / .AppImage). Existing installations update automatically. Release notes below.
          NOTES
            sed -i "s/__VERSION__/${TAG}/" notes.md
            gh release create "$TAG" --draft --title "Prudii Mail ${TAG}" --notes-file notes.md
            id="$(find_id)"
          fi

          [ -n "$id" ] || { echo "Release-ID nicht ermittelbar" >&2; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # create-release laeuft nur bei Tags; bei einem manuellen Lauf wird es
    # uebersprungen, und ohne dieses if wuerde build mit uebersprungen.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - name: macos-intel
            platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: x86_64-apple-darwin
          - name: linux-x86_64
            platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: windows-x86_64
            platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Systempakete, die Tauri v2 auf Linux zum Bauen braucht
      # (webkit2gtk 4.1 = v2, ayatana-appindicator = tray-icon-Feature).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            desktop-file-utils \
            file wget curl

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Schreibt den App-Store-Connect-API-Key (.p8) fuer die Notarisierung
      # aus dem Base64-Secret in eine Datei (nur macOS-Runner).
      - name: Prepare Apple notarization key (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compile-Zeit-Secret fuer Gmail-OAuth. build.rs liest zuerst die
          # Env-Variable -> hier reicht das Repository-Secret voellig.
          PRUDII_GOOGLE_CLIENT_SECRET: ${{ secrets.PRUDII_GOOGLE_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (ignored on Windows/Linux runners)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        with:
          # Nur hochladen, nie anlegen: den Release besitzt create-release. Bei einem
          # manuellen Lauf ist die ID leer und es wird ausschliesslich gebaut.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          updaterJsonPreferNsis: true
          # Auto-retry: Apples Notary-Service / macOS-Runner haben sporadische
          # Netzwerk-Timeouts (actions/runner-images#14167) — dann neu versuchen.
          retryAttempts: 2
          args: ${{ matrix.args }}

      # Die AppImage bringt libwayland-* aus Ubuntu 22.04 mit und stellt sie per
      # LD_LIBRARY_PATH vor die System-Libs. Auf Distros mit neuem Mesa (Arch/
      # CachyOS) stirbt der WebKit-Prozess daran. Rausschmeissen und neu signieren
      # (die AppImage ist selbst das Updater-Artefakt).
      - name: Strip host-coupled libraries from AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/fix-appimage.sh

      # Damit auch manuelle Laeufe (ohne Tag) herunterladbare Installer liefern.
      - name: Upload installers as workflow artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prudii-${{ matrix.name }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

  # tauri-action laedt die AppImage waehrend des Builds hoch — also die Version vor
  # dem Repack. Hier werden Asset und Signatur ersetzt und latest.json nachgezogen
  # (Asset-ID und Signatur aendern sich beide, sonst schlaegt das Auto-Update fehl).
  # Eigener Job, weil jeder Matrix-Job latest.json schreibt: erst wenn alle durch
  # sind, kann gefahrlos gepatcht werden.
  publish-linux-appimage:
    name: Publish repacked AppImage
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prudii-linux-x86_64
          path: linux

      - name: Replace AppImage assets and patch latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so gh cannot infer the repo from git.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          appimage="$(find linux -name '*.AppImage' -print -quit)"
          [ -n "$appimage" ] || { echo "repacked AppImage missing from artifacts" >&2; exit 1; }
          [ -f "${appimage}.sig" ] || { echo "signature missing for $appimage" >&2; exit 1; }

          # tauri-action replaces spaces with dots when it uploads; the asset name comes
          # from the file name, so match it exactly or --clobber adds a second asset.
          dir="$(dirname "$appimage")"
          asset="$(basename "$appimage" | tr ' ' '.')"
          if [ "$(basename "$appimage")" != "$asset" ]; then
            mv "$appimage" "$dir/$asset"
            mv "${appimage}.sig" "$dir/${asset}.sig"
            appimage="$dir/$asset"
          fi

          gh release upload "$TAG" "$appimage" "${appimage}.sig" --clobber

          # --clobber re-uploads the asset, so it gets a fresh ID; latest.json
          # addresses assets by ID (the release is a draft and has no public URL yet).
          name="$(basename "$appimage")"
          asset_url="$(gh release view "$TAG" --json assets \
            --jq ".assets[] | select(.name == \"$name\") | .apiUrl")"
          [ -n "$asset_url" ] || { echo "uploaded asset not found in release" >&2; exit 1; }
          signature="$(cat "${appimage}.sig")"

          gh release download "$TAG" --pattern latest.json --dir . --clobber
          jq --arg url "$asset_url" --arg sig "$signature" '
            .platforms |= with_entries(
              if (.key == "linux-x86_64" or .key == "linux-x86_64-appimage")
              then .value.url = $url | .value.signature = $sig
              else . end
            )
          ' latest.json > latest.json.new
          mv latest.json.new latest.json
          gh release upload "$TAG" latest.json --clobber

  # Der Doppel-Release bei v1.6.2 fiel nur auf, weil jemand die Artefaktliste
  # durchgezaehlt hat. Ein fehlender Installer sieht sonst aus wie ein gruener Lauf,
  # bis sich Nutzer melden — deshalb wird hier geprueft statt gehofft.
  verify-release:
    name: Verify release is complete
    needs: [create-release, publish-linux-appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Check release count, installers and updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          set -euo pipefail
          fail=0
          note() { echo "  $1"; }

          count="$(gh api "repos/$GH_REPO/releases" --paginate             --jq "[.[] | select(.tag_name == \"$TAG\")] | length")"
          echo "Releases fuer $TAG: $count"
          [ "$count" = "1" ] || { note "ERWARTET: genau 1 — mehrere Releases teilen sich die Installer"; fail=1; }

          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' > assets.txt
          echo "Artefakte:"; sed 's/^/  /' assets.txt

          echo "Installer:"
          for pattern in '\.exe$' '\.msi$' 'aarch64\.dmg$' 'x64\.dmg$' '\.deb$' '\.rpm$' '\.AppImage$'; do
            if grep -qE "$pattern" assets.txt; then note "ok      $pattern"
            else note "FEHLT   $pattern"; fail=1; fi
          done

          gh api -H "Accept: application/octet-stream"             "repos/$GH_REPO/releases/assets/$(gh api "repos/$GH_REPO/releases/$RELEASE_ID"               --jq '.assets[] | select(.name == "latest.json") | .id')" > latest.json

          echo "Updater-Plattformen:"
          for key in windows-x86_64 windows-x86_64-msi darwin-aarch64 darwin-x86_64 linux-x86_64; do
            if jq -e --arg k "$key" '.platforms[$k].url // empty | length > 0' latest.json >/dev/null; then
              note "ok      $key"
            else
              note "FEHLT   $key — diese Plattform bekaeme das Update nicht angeboten"; fail=1
            fi
          done

          [ "$fail" = "0" ] || { echo "::error::Release $TAG ist unvollstaendig — nicht veroeffentlichen"; exit 1; }
          echo "Release $TAG ist vollstaendig."
