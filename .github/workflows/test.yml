name: Tests

# Laeuft bei jedem Push und PR: Frontend-Tests (vitest) + TypeScript-Build auf
# Linux, Rust-Tests (Unit + SQLite-Integrationstests) auf Windows — dort
# braucht die Tauri-Lib keine Systempakete und matcht die Dev-Umgebung.
#
# Third-Party-Actions auf feste Commit-SHAs gepinnt (wie release.yml).
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Run tests
        working-directory: src-tauri
        run: cargo test
